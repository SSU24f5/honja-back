services:
  app:
    build: .
    container_name: hon-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database-1.c7kk06au6o77.ap-northeast-2.rds.amazonaws.com:3306/HON_DB
