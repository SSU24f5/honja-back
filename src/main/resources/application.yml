spring:
  config:
    import: optional:application-secret.yml
  datasource:
    url: jdbc:mysql://localhost:3306/HON_DB
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


jwt:
  token:
    secret: ${jwt.secret-key}
    expiration:
      access: 3600000
